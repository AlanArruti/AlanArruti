name: Gráfico de lenguajes

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/languages.mjs
      - .github/workflows/languages.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generar SVGs
        run: node .github/scripts/languages.mjs
        env:
          GH_TOKEN: ${{ secrets.LANGS_TOKEN }}
          EXCLUDE_LANGS: ''

      - name: Commit si cambió
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add languages-light.svg languages-dark.svg
          git diff --cached --quiet || (git commit -m 'Actualizar gráfico de lenguajes' && git push)
